# plantbot config. Hardware we haven't confirmed is marked (assumed).
# Swap drivers/pins here, not in code. `--mock` forces every device to its mock driver.

server:
  host: 0.0.0.0
  port: 8000

motors:
  # servo    = 2 continuous-rotation servos (rover v1 CAD)
  # gpiozero = TB6612FNG / L298N H-bridge (current rover: TT gear motors on a TB6612FNG)
  # serial   = Arduino motor shield over USB (see software/README.md firmware fallback)
  # mock     = prints / tracks speeds only
  driver: gpiozero
  watchdog_ms: 500             # stop if no drive command for this long
  max_speed: 1.0               # global clamp, 0..1
  invert_left: false
  invert_right: false          # flip if hw_check spins a wheel backwards (or swap its motor leads)
  trim_left: 0.0               # servo stop-point trim (-0.1..0.1) if a wheel creeps at 0
  trim_right: 0.0
  servo:
    left_pin: 12               # GPIO (BCM). Hardware-PWM capable pins: 12, 13, 18, 19
    right_pin: 13
    min_pulse_ms: 1.0
    max_pulse_ms: 2.0
  hbridge:
    # Current wiring: AIN1+BIN1 share GPIO20, AIN2+BIN2 share GPIO21, PWMA+PWMB share GPIO13,
    # so both wheels always get the same command (forward/back only, no steering).
    # Give the right side its own three pins to get differential steering back.
    left_in1: 20
    left_in2: 21
    left_pwm: 13
    right_in1: 20
    right_in2: 21
    right_pwm: 13
    stby: 26                   # TB6612 only; null for L298N
    pwm_hz: 1000               # TB6612 takes up to 100 kHz; software PWM on the Pi is fine at 1 kHz
    min_duty: 0.3              # (assumed) duty where a TT motor starts turning on the ground; tune with hw_check
    # Motor supply (VM): ~6 V from a buck converter off the 3S LiPo. TT motors are 3-6 V.
  serial:
    port: /dev/ttyACM0
    baud: 115200

camera:
  # opencv   = USB webcam (Logitech on the rover, or your laptop webcam)
  # picamera = Pi Camera Module on CSI via picamera2
  # folder   = cycle photos in mock.camera_folder (synthetic plants if the folder is empty)
  driver: opencv
  device: 0                    # /dev/videoN for opencv
  width: 1280
  height: 720
  lores_width: 640
  lores_height: 480
  stream_fps: 12
  jpeg_quality: 75

env:
  driver: real                 # real = BME680 + MQ-2 via ADS1115; mock
  i2c_bus: 1
  bme680_address: 0x77         # 0x77 Adafruit, 0x76 generic. Check with `i2cdetect -y 1`
  ads1115_address: 0x48
  ads1115_channel: 0           # A0 = MQ-2 AO
  ads1115_gain: 1              # 1 = +/-4.096 V full scale
  mq2:
    divider: 1.5               # Vout = Vads * divider (e.g. 1k/2k divider on the 5V AO -> 1.5)
    vc: 5.0                    # MQ-2 module supply voltage
    rl_kohm: 1.0               # load resistor on the module (MEASURE IT, often 1-10k)

mouse_drive:                   # tank drive from a USB mouse plugged into the Pi
  enabled: true                # always off in --mock (it would grab the laptop's mouse)
  device: null                 # null = first mouse found; or e.g. /dev/input/event3
  grab: true                   # keep clicks away from any desktop on the Pi
  speed: 0.6                   # 0..1 per wheel while a button is held
  buttons:                     # evdev names; `python -m evdev.evtest` shows what each button sends
    right_fwd: BTN_RIGHT       # mb1 (right click)
    left_fwd: BTN_LEFT         # mb2 (left click)
    right_back: BTN_MIDDLE     # mb3 (wheel click)
    left_back: BTN_SIDE        # mb4 (thumb/back button)

ranger:
  driver: hcsr04               # hcsr04 | none | mock
  trig_pin: 5
  echo_pin: 6                  # 5V echo: divide to 3.3V!
  max_cm: 200

fan:
  driver: none                 # gpio | none | mock. Off: GPIO26 is now motor STBY; pick a free pin to re-enable
  pin: 26

sensing:
  sample_hz: 10
  smooth_alpha: 0.3            # EWMA on raw readings
  warmup_s: 120                # max warm-up time; ends earlier if readings are stable
  warmup_min_s: 30
  warmup_stable_slope: 0.002   # V/s on MQ-2; below this for warmup_stable_s = warmed up
  warmup_stable_s: 20
  baseline_alpha: 0.002        # slow baseline tracking while IDLE/CRUISE (per sample)
  sniff_settle_s: 2.0          # fan on, wait for air to arrive
  sniff_window_s: 6.0          # then average this long
  csv_hz: 1
  # Plant-vs-background VOC differential. Rover v3: MQ-2 at the front (at the plant),
  # BME680 at the rear (background). The MQ-2 is mapped onto the BME680's scale with a
  # fit from tools/crosscal.py; until that file exists, an identity map is used and the
  # health score falls back to the plain ratios.
  differential:
    plant_sensor: mq2          # mq2 | bme680: which sensor faces the plant
    calibration: calibration/crosscal.json

vision:
  work_width: 640              # isolate runs on a downscaled copy
  # OpenCV HSV: H 0-180. Range covers brown/yellow (5-35) and green (35-90).
  hue_min: 5
  hue_max: 90
  sat_min: 40
  val_min: 30
  brown_hue_max: 22            # hues below this are "brown" and need brown_sat_min
  brown_sat_min: 70
  tile_px: 32                  # Laplacian-variance tile size
  sharp_rel: 0.15              # tile is "sharp" if var > sharp_rel * 90th percentile tile var
  sharp_abs_min: 15.0
  center_frac: 0.5             # blob must touch the central region of this size
  min_blob_frac: 0.02          # smaller blobs -> fallback center crop
  pad_frac: 0.10
  fallback_crop_frac: 0.6

classifier:
  backend: dummy               # dummy | tflite | onnx | remote
  model: models/plant.tflite   # or models/plant.onnx
  labels: models/labels.txt
  input_size: 224
  normalize: "0-1"             # "0-1" | "-1-1" | "imagenet"
  remote_url: http://laptop.local:8001/predict
  remote_timeout_s: 5

fusion:
  w_img: 0.7
  w_voc: 0.3
  voc_full_scale: 0.5
  voc_mode: differential       # differential (plant minus background, needs crosscal) | ratios
  healthy_min: 70
  watch_min: 40

mission:
  settle_s: 0.5
  cruise_speed: 0.35
  approach_speed: 0.2
  approach_cm: 25              # (unverified) start approach when plant is this close
  stop_cm: 15                  # (unverified) stop and scan here
  clear_cm: 40                 # PASS_PLANT until range is above this
  pass_timeout_s: 5
  auto_max_scans: 5
  auto_timeout_s: 180

store:
  dir: scans

tactile:
  # TouchTronix SensX25 5x5 pressure film on its FT232 USB adapter (921600 8N1, ~100 Hz).
  # sensx25 = built-in reader | vendor = their sensx25.py frames() | mock | none
  driver: sensx25
  port: /dev/ttyUSB0           # `ls /dev/ttyUSB*`; needs `sudo usermod -aG dialout $USER`
  vendor_path: sensx25.py      # only for driver: vendor
  mode: pressure               # pressure (0-534, as shipped) | adc (0-3945). Return the kit in pressure mode!
  noise_floor: 0               # per-pixel counts zeroed after the baseline
  buffer_frames: 1000          # ~10 s of history
  arm:
    driver: servo              # servo | rover (film on the nose: creep the rover into the leaf) | mock | none
    pin: 18                    # (unverified) must be a free GPIO; motors use 13/20/21/26, ranger 5/6
    retract_deg: 0             # (unverified) tune on the rover
    press_deg: 60              # (unverified) far enough to reach a leaf at mission.stop_cm
    min_pulse_ms: 0.5
    max_pulse_ms: 2.5
    mock_travel_mm: 8.0
    mock_gap_mm: 3.0
  turgor:
    enabled: true              # press the leaf during every scan (after the photo)
    contact_on: 20             # (unverified) a.u. pixel-sum: contact starts
    contact_off: 10
    ref_force: 250             # (unverified) a.u.: read contact pressure at this force
    target_force: 400          # (unverified) stop pressing here (gentle)
    max_peak: 500              # abort if any pixel nears saturation (534)
    ramp_s: 2.5
    hold_s: 0.5
    turgid_ref: 55             # (unverified, mock-derived) a.u./px; calibrate on a watered leaf
    wilted_ref: 12             # (unverified, mock-derived) a.u./px; calibrate on a wilted leaf
    push_speed: 0.18           # arm.driver: rover only
    calibration: calibration/turgor.json
    w_turgor: 0.25             # weight in the fused health score
  bumper:
    enabled: false             # true when the film is on the nose (arm.driver: rover)
    stop_force: 60             # (unverified) a.u. pixel-sum = bump
    release_force: 20
    debounce_frames: 2
    hold_s: 1.0                # forward drive stays blocked this long after release (reverse always OK)

zelos:
  # Live signals to the Zelos desktop app (zeloscloud.io). pip install zelos-sdk. No SDK = off.
  enabled: true
  url: null                    # null = $ZELOS_AGENT_URL or http://localhost:2300; e.g. grpc://<laptop-ip>:2300
  rate_hz: 10
  tactile_hz: 50

leaflink:
  # LeafLink server (GPU laptop: real leaf model + field map). URL and token come from the
  # environment, LEAFLINK_URL and LEAFLINK_TOKEN (on the Pi: ~/plantbot/.env). Unset = off.
  enabled: true
  device: rover-1              # LeafLink device id: scans and VOC samples are grouped by it
  voc_hz: 1                    # VOC samples per second sent as top (plant side) / bottom (background)
  flush_s: 3                   # batch VOC uploads this often
  timeout_s: 10
  lat: null                    # optional fixed field position; no GPS on the rover
  lon: null

gemini:
  # Plant Doctor (multimodal diagnosis per scan) + natural-language commands. Key from the
  # environment, GEMINI_API_KEY (Pi: ~/plantbot/.env). No key = off, rover unchanged.
  enabled: true
  model: gemini-3.6-flash      # stable Flash; gemini-3.5-flash-lite = faster, gemini-3.8-flash = smarter
  command_model: null          # null = same as model
  thinking_level: low          # minimal | low | medium | high | null (model default). Low keeps latency ~seconds
  timeout_s: 15
  auto_diagnose: true          # diagnose every scan in the background and push it to the dashboard
  mock: auto                   # auto = canned diagnosis + keyword commands when --mock and no key; true | false
  command:
    max_actions: 8
    max_speed: 0.5             # on top of motors.max_speed
    drive_speed: 0.4
    turn_speed: 0.45
    cm_per_s: 12.0             # (unverified) measure: drive_speed for 2 s, divide distance by 2
    deg_per_s: 110.0           # (unverified) measure: time a full spin at turn_speed
    max_segment_s: 3.0
    max_motion_s: 15.0         # total drive+turn seconds per command, return trip included
    max_scans: 3
    scan_timeout_s: 40

integrations:
  # Optional cloud sinks (plantbot/integrations/). Each is OFF unless its env var is set in ~/plantbot/.env.
  enabled: true
  rover_id: null               # default: leaflink.device
  reading_hz: 10               # env samples forwarded per second (sampler runs at sensing.sample_hz)
  tigerdata:                   # needs TIGERDATA_URL
    flush_s: 2
    buffer_max: 6000           # ~10 min at 10 Hz kept while offline; oldest dropped
  snowflake:                   # needs SNOWFLAKE_ACCOUNT + SNOWFLAKE_PAT
    flush_s: 60
  solana:                      # needs SOLANA_KEYPAIR (devnet only)
    confirm_s: 20

mock:
  camera: folder               # folder | opencv  (--camera overrides)
  camera_folder: test_images
  warmup_s: 5
  # Scripted VOC events, seconds after start: mq2_dv adds volts, gas_scale multiplies resistance.
  # The scripted event is room-wide (both sensors move, differential stays near 1); the
  # button is a plant-local smell (front MQ-2 moves more than rear BME680, differential rises).
  env_script:
    - {t: 40, duration: 12, mq2_dv: 0.35, gas_scale: 0.6}
  # Dashboard "Mock VOC spike" button uses these
  spike: {duration: 12, mq2_dv: 0.4, gas_scale: 0.85}
  leaf_turgor: 0.8             # MockTactile leaf (0 wilted .. 1 turgid); {"cmd":"mock_leaf"} changes it
  plant_spacing_cm: 60         # MockRanger: plants along a virtual row
  speed_cm_s: 30               # MockRanger: cm/s at drive(1, 1)
